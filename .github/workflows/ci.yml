name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16', '17', '18']
    # The suite needs a real PostgreSQL; scripts/with-postgres.sh uses PG_TEST_URL when it is set.
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PG_TEST_URL: postgres://test:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report-pg${{ matrix.postgres }}
          path: .jest-report.json
          if-no-files-found: ignore
          retention-days: 7

  consumers:
    # The packed build installed into throwaway consumer projects (commonjs, node16, nodenext,
    # bundler+ESM, nodenext+ESM, npm next to sibling packages): tsc, ts-jest and runtime import.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:consumers
